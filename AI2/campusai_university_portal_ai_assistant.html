        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-indigo-600';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 text-sm font-medium animate-fade-in pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function getAIResponse(prompt) {
            const query = prompt.toLowerCase();
            
            if (query.includes('lesson') || query.includes('class') || query.includes('schedule') || query.includes('today') || query.includes('timetable')) {
                if (query.includes('1') || query.includes('first')) {
                    const l = DB.lessonsToday[0];
                    return `📅 **Lesson 1 Details:**\n• **Course:** ${l.code} - ${l.name}\n• **Time:** ${l.time}\n• **Instructor:** ${l.instructor}\n• **Classroom:** ${l.room}\n• **Status:** ${l.status}`;
                } else if (query.includes('2') || query.includes('second')) {
                    const l = DB.lessonsToday[1];
                    return `📅 **Lesson 2 Details:**\n• **Course:** ${l.code} - ${l.name}\n• **Time:** ${l.time}\n• **Instructor:** ${l.instructor}\n• **Classroom:** ${l.room}\n• **Status:** ${l.status}`;
                } else if (query.includes('3') || query.includes('third')) {
                    const l = DB.lessonsToday[2];
                    return `📅 **Lesson 3 Details:**\n• **Course:** ${l.code} - ${l.name}\n• **Time:** ${l.time}\n• **Instructor:** ${l.instructor}\n• **Classroom:** ${l.room}\n• **Status:** ${l.status}`;
                } else if (query.includes('4') || query.includes('fourth')) {
                    const l = DB.lessonsToday[3];
                    return `📅 **Lesson 4 Details:**\n• **Course:** ${l.code} - ${l.name}\n• **Time:** ${l.time}\n• **Instructor:** ${l.instructor}\n• **Classroom:** ${l.room}\n• **Status:** ${l.status}`;
                } else {
                    let summary = "📋 **Your Lessons & Schedule for Today:**\n\n";
                    DB.lessonsToday.forEach(l => {
                        summary += `**Lesson ${l.num} (${l.time})**: ${l.code} (${l.name}) at *${l.room}* [${l.status}]\n`;
                    });
                    summary += "\nAsk me 'Where is lesson 2?' or 'Tell me about lesson 1' for specific room directions!";
                    return summary;
                }
            } else if (query.includes('where') || query.includes('room') || query.includes('hall') || query.includes('building') || query.includes('map')) {
                if (query.includes('lesson 1') || query.includes('cs101') || query.includes('hall b')) {
                    return "📍 **Hall B (Science Center, Level 2):**\nLocated inside the Science Center. Enter through the main west doors, take the central atrium stairs to the 2nd floor, and Hall B is immediately on your right.";
                } else if (query.includes('lesson 2') || query.includes('math') || query.includes('102')) {
                    return "📍 **Math Hall 102 (Floor 1):**\nLocated in the Mathematics Department building adjacent to the quad. Room 102 is on the ground floor near the east entrance.";
                } else if (query.includes('lesson 3') || query.includes('physics') || query.includes('lab')) {
                    return "📍 **Physics Lab 1 (Basement):**\nLocated in the Science Center basement level. Access via elevator B or the stairwell near the west exit.";
                } else if (query.includes('library')) {
                    return "📍 **University Library:**\nOpen 24/7 during midterms. Located at the center of campus opposite the Student Union.";
                } else {
                    return "📍 **Campus Building Finder:**\nWe have 5 main campus zones indexed. You can check the 'Map & Directory' tab or ask specifically about 'Hall B', 'Math Hall 102', or 'Physics Lab 1' for step-by-step directions.";
                }
            } else if (query.includes('deadline') || query.includes('add') || query.includes('drop') || query.includes('exam')) {
                return "⚠️ **Important Academic Dates:**\n• Add/Drop Deadline: This Friday at 5:00 PM.\n• Midterm Week: Starts next Monday (Library open 24/7).\n• Course Registration for next semester opens November 1st.";
            } else if (query.includes('email') || query.includes('professor') || query.includes('draft')) {
                return "✉️ **Professional Professor Email Draft:**\n\n'Dear Professor [Name],\n\nI hope this email finds you well. I am a student in your [Course Code] class, and I would like to ask a quick question regarding [Topic/Assignment].\n\nThank you for your guidance.\n\nBest regards,\n[Your Name]'";
            } else {
                return `I've processed your query about "${prompt}". As your CampusAI assistant, I can look up today's lessons (e.g. 'What lessons do I have?'), classroom directions ('Where is lesson 2?'), and academic deadlines. How else can I help?`;
            }
        }

        function render() {

            } else {

                attachEventListeners();

        function renderActiveTabContent() {
            switch(appState.activeTab) {
                case 'chat': return renderChatTab();
                case 'map': return renderMapTab();
                case 'portal': return renderPortalTab();
                case 'admin': return renderAdminTab();
                default: return renderChatTab();
            }
        }

        function quickLogin(role) {
            const user = DB.users.find(u => u.role === role);
            if (user) {
                appState.currentUser = user;
                appState.activeTab = 'chat';
                showToast(`Logged in successfully as ${user.name} (${user.role})!`);
                render();
            }
        }

        function logout() {
            appState.currentUser = null;
            showToast('Signed out successfully.', 'info');
            render();
        }

        function switchTab(tab) {
            appState.activeTab = tab;
            render();
        }

        function toggleDarkMode() {
            appState.darkMode = !appState.darkMode;
            render();
        }

        function clearChat() {
            DB.messages = [
                { sender: 'ai', text: 'Chat history cleared. Ask me about your lessons today or classroom locations!', time: 'Just now' }
            ];
            showToast('Chat history cleared.', 'info');
            render();
        }

        function sendPresetPrompt(promptText) {
            DB.messages.push({ sender: 'user', text: promptText, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
            render();
            scrollToBottom();

            setTimeout(() => {
                const aiReply = getAIResponse(promptText);
                DB.messages.push({ sender: 'ai', text: aiReply, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
                render();
                scrollToBottom();
            }, 600);
        }

        function handleChatSubmit(e) {
            e.preventDefault();
            const inputField = document.getElementById('chat-input-field');
            const text = inputField.value.trim();
            if (!text) return;

            DB.messages.push({ sender: 'user', text: text, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
            inputField.value = '';
            render();
            scrollToBottom();

            setTimeout(() => {
                const aiReply = getAIResponse(text);
                DB.messages.push({ sender: 'ai', text: aiReply, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
                render();
                scrollToBottom();
            }, 700);
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-messages-container');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function simulateCsvImport() {
            appState.adminCsvStatus = 'Successfully processed lessons_schedule.csv & student_roster.csv (450 rows) & updated AI embeddings.';
            DB.logs.unshift({ id: 'l_new', timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), type: 'SYSTEM', details: 'CSV timetable batch import completed successfully.' });
            showToast('Lessons timetable and roster imported successfully!');
            render();
        }

        function handleAnnouncementSubmit(e) {
            e.preventDefault();
            const titleInput = document.getElementById('ann-title');
            const contentInput = document.getElementById('ann-content');
            if (!titleInput.value || !contentInput.value) {
                showToast('Please fill in both announcement title and content.', 'error');
                return;
            }

            DB.announcements.unshift({
                id: 'a_' + Date.now(),
                title: titleInput.value,
                date: 'Today',
                author: appState.currentUser.name,
                content: contentInput.value
            });

            DB.logs.unshift({
                id: 'l_ann_' + Date.now(),
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                type: 'SYSTEM',
                details: `Broadcast announcement published: "${titleInput.value}"`
            });

            showToast('Announcement broadcasted to all portals!');
            titleInput.value = '';
            contentInput.value = '';
            render();
        }

        function attachEventListeners() {
            if (appState.activeTab === 'chat') {
                scrollToBottom();
            }
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
